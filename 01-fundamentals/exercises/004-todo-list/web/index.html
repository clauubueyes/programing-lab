<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>To-Do List</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>To-Do List</h1>
        <p>Manage all your task!</p>

        <form id="add-task">
            <label for="title-task">Add Task</label>
            <input type="text" name="title-task" id="title-task" placeholder="Type any title ... ">
            <button type="submit">Add task</button>
        </form>
        <p id="error"></p>
        <ul id="tasks">

        </ul>
        <script src="script.js"></script>
    </body>

</html>
