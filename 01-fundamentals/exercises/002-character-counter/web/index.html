<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Character Counter</title>
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>

    <body>
        <h1>Character Counter</h1>
        <h2>Counter of characters of any text you input</h2>

        <div>
            <label for="input">Enter a text:</label>
            <textarea id="input" rows="5" cols="50" placeholder="Enter any text"></textarea>
        </div>
        
        <div>
           <h3>Characters: <span id="character-counter">0</span></h3>
        </div>
    </body>
</html>
