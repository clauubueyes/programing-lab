<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Number Guessing Game</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Number Guessing Game</h1>
        <h2>Guess a number between 1 and 100</h2>

        <form id="numberGuessForm">
            <label for="input-number">Enter a number:</label>
            <input type="number" id="input-number" placeholder="33" required>
            <input type="submit" id="submit-buton" value="Guess">
        </form>
        <h3><span id="hint"></span></h3>
        <h3>You have <span id="attempts">5</span> attempts</h3>
    
        <script src="script.js"></script>
    </body>
</html>
